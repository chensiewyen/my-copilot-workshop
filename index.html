<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-card">
    <header class="todo-header">
      <div class="title-row">
        <div>
          <p class="eyebrow">TODAY</p>
          <h1>待辦清單</h1>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切換至深色模式"></button>
      </div>
      <p class="subtitle">把想完成的事，一件一件放進今天。</p>
    </header>

    <form class="todo-form" id="todo-form">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        type="text"
        placeholder="接下來要完成什麼？"
        autocomplete="off"
        maxlength="200"
      >
      <button type="submit">新增</button>
    </form>

    <nav class="filter-bar" aria-label="待辦事項篩選">
      <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </nav>

    <section class="todo-list-area" aria-live="polite">
      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty-message" id="empty-message"></p>
    </section>

    <footer class="todo-footer">
      <span id="remaining-count">未完成:0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
